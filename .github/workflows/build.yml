name: Compile & Test

permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug
  BUILDMASTER_DEBUG: 1

jobs:
  ###########################################################################
  # LINUX — full matrix (SYSTEM / BUNDLED / OFF)
  ###########################################################################
  build-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
        sqlite: [BUNDLED, SYSTEM, OFF]
        postgres: [BUNDLED, SYSTEM, OFF]
        mariadb: [BUNDLED, SYSTEM, OFF]
        exclude:
          - compiler: clang-libc++
            mariadb: SYSTEM
          - compiler: clang-libc++
            postgres: SYSTEM
          - compiler: clang-libc++
            sqlite: SYSTEM

    name: linux-${{ matrix.compiler }}-mariadb(${{ matrix.mariadb }})-postgres(${{ matrix.postgres }})-sqlite(${{ matrix.sqlite }})

    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies (sqlite)
        if: matrix.sqlite == 'SYSTEM'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'libsqlite3-dev'
          cache-key: apt-sqlite-system-deps

      - name: Install system dependencies (postgres)
        if: matrix.postgres == 'SYSTEM'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'libpq-dev'
          cache-key: apt-postgres-system-deps

      - name: Install system dependencies (mariadb)
        if: matrix.mariadb == 'SYSTEM'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'libmariadb-dev'
          cache-key: apt-mariadb-system-deps

      - name: Install MariaDB server (for tests when != OFF)
        if: matrix.mariadb != 'OFF'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'mariadb-server'
          cache-key: apt-mariadb-server

      - name: Start MariaDB and create test DB
        if: matrix.mariadb != 'OFF'
        shell: bash
        run: |
          set -euo pipefail
          sudo service mariadb start || sudo systemctl start mariadb
          for i in $(seq 1 60); do
            if sudo mysql -e "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo mysql -e "CREATE USER IF NOT EXISTS 'testuser'@'localhost' IDENTIFIED BY 'testpass';"
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS stormbyte_test;"
          sudo mysql -e "GRANT ALL PRIVILEGES ON stormbyte_test.* TO 'testuser'@'localhost'; FLUSH PRIVILEGES;"

      - name: Create Postgres test DB
        if: matrix.postgres != 'OFF'
        shell: bash
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          psql -h 127.0.0.1 -U postgres -c "CREATE USER testuser WITH PASSWORD 'testpass';" || true
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE stormbyte_test OWNER testuser;" || true

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_ASAN=ON
            -DENABLE_TEST=ON
            -DWITH_SQLITE=${{ matrix.sqlite }}
            -DWITH_POSTGRES=${{ matrix.postgres }}
            -DWITH_MARIADB=${{ matrix.mariadb }}
            -DWITH_STORMBYTE=BUNDLED
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # macOS — only BUNDLED / OFF (no SYSTEM → no Homebrew static client + OpenSSL)
  ###########################################################################
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, clang-libc++, gcc]
        sqlite: [BUNDLED, OFF]
        postgres: [BUNDLED, OFF]
        mariadb: [BUNDLED, OFF]

    name: macos-${{ matrix.compiler }}-mariadb(${{ matrix.mariadb }})-postgres(${{ matrix.postgres }})-sqlite(${{ matrix.sqlite }})

    env:
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      # Servers only when backend is enabled (BUNDLED still needs a live server for tests)
      - name: Install and start Postgres (brew)
        if: matrix.postgres != 'OFF'
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@15
          brew link --force --overwrite postgresql@15 || true
          brew services start postgresql@15
          for i in $(seq 1 60); do
            if pg_isready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          createuser -s testuser 2>/dev/null || true
          psql -d postgres -c "ALTER USER testuser WITH PASSWORD 'testpass';" || true
          createdb -O testuser stormbyte_test 2>/dev/null || true

      - name: Install and start MariaDB (brew)
        if: matrix.mariadb != 'OFF'
        shell: bash
        run: |
          set -euo pipefail
          brew install mariadb
          brew services start mariadb
          for i in $(seq 1 90); do
            if mysqladmin ping --silent 2>/dev/null; then break; fi
            sleep 1
          done
          # Homebrew uses unix_socket auth as the current user (not root password)
          ADMIN_USER="$(whoami)"
          mysql -u "$ADMIN_USER" -e "CREATE USER IF NOT EXISTS 'testuser'@'localhost' IDENTIFIED BY 'testpass';"
          mysql -u "$ADMIN_USER" -e "CREATE DATABASE IF NOT EXISTS stormbyte_test;"
          mysql -u "$ADMIN_USER" -e "GRANT ALL PRIVILEGES ON stormbyte_test.* TO 'testuser'@'localhost'; FLUSH PRIVILEGES;"

      # Optional: SSL disabled for BUNDLED connector build / runtime policy
      - name: OpenSSL (optional, for BUNDLED MariaDB connector)
        if: matrix.mariadb == 'BUNDLED'
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3
          PREFIX="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT_DIR=${PREFIX}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${PREFIX}:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${PREFIX}/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${PREFIX}/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_ASAN=ON
            -DENABLE_TEST=ON
            -DWITH_SQLITE=${{ matrix.sqlite }}
            -DWITH_POSTGRES=${{ matrix.postgres }}
            -DWITH_MARIADB=${{ matrix.mariadb }}
            -DWITH_MARIADB_SSL_DISABLED=ON
            -DWITH_STORMBYTE=BUNDLED
            ${{ env.OPENSSL_ROOT_DIR != '' && format('-DOPENSSL_ROOT_DIR={0}', env.OPENSSL_ROOT_DIR) || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # WINDOWS — keep as you had (SYSTEM optional; BUNDLED typical)
  ###########################################################################
  build-windows:
    runs-on: windows-latest
    name: windows-msvc

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: msvc
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_SQLITE=BUNDLED
            -DWITH_POSTGRES=BUNDLED
            -DWITH_MARIADB=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
          run-tests: false

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --output-on-failure --test-dir "${{ github.workspace }}\build\test"